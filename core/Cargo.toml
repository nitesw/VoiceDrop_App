[package]
name = "voicedrop-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "voicedrop_core"
crate-type = ["staticlib", "lib"]

[dependencies]
cpal = "0.15"
hound = "3.5"
whisper-rs = "0.16"
llama-cpp-2 = "0.1"
llama-cpp-sys-2 = { version = "0.1", features = ["dynamic-link"] }
encoding_rs = "0.8"
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
