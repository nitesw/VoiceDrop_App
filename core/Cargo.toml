[package]
name = "voicedrop-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "voicedrop_core"
crate-type = ["staticlib", "lib"]

[dependencies]
cpal = "0.15"
# `metal` runs Whisper on the Apple GPU; without it large-v3-turbo is too
# slow on CPU alone (see ADR-0009).
whisper-rs = { version = "0.16", features = ["metal"] }
ureq = "3"
